[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:websock]
startsecs=3
startretries=1000000
stopwaitsecs=10
stopasgroup=true
killasgroup=true
command=python3 -u /app/pythings/websock_server/ws_server.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=10

[program:firework-daemon]
startsecs=3
startretries=1000000
stopwaitsecs=10
stopasgroup=true
killasgroup=true
command=python3 -u /app/pythings/pc_daemon/pc_daemon.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=20

[program:audio-player]
startsecs=3
startretries=1000000
stopwaitsecs=10
stopasgroup=true
killasgroup=true
command=python3 -u /app/pythings/audio_player/audio_player.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=25

[program:byh-app]
startsecs=3
startretries=1000000
stopwaitsecs=10
stopasgroup=true
killasgroup=true
command=npm run dev
environment=PORT=1776,NODE_ENV=development,HOSTNAME=0.0.0.0
directory=/app/byh_app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=30